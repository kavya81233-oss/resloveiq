name: ResolveIQ CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Pytest & Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Database Seed
        working-directory: ./backend
        run: |
          PYTHONPATH=. python -m app.seed

      - name: Run Pytest Suite
        working-directory: ./backend
        run: |
          PYTHONPATH=. pytest tests/

      - name: Run 120-Complaint Benchmark Evaluation
        working-directory: ./backend
        run: |
          PYTHONPATH=. python eval/run_eval.py

  frontend-check:
    name: Frontend Lint, Typecheck & Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: ESLint Check
        working-directory: ./frontend
        run: npm run lint

      - name: TypeScript Strict Check
        working-directory: ./frontend
        run: npm run typecheck

      - name: Run Vitest Suite & Axe-Core Accessibility
        working-directory: ./frontend
        run: npm run test

      - name: Next.js Production Build
        working-directory: ./frontend
        run: npm run build

