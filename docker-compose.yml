services:
  db:
    image: pgvector/pgvector:pg16
    container_name: resolveiq_db
    environment:
      POSTGRES_USER: resolveiq
      POSTGRES_PASSWORD: resolveiq
      POSTGRES_DB: resolveiq
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveiq"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    container_name: resolveiq_api
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: sh -c 'python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000'
  web:
    build: ./frontend
    container_name: resolveiq_web
    env_file: ./frontend/.env
    depends_on:
      - api
    ports:
      - "3000:3000"
volumes:
  dbdata:

